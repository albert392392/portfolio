<style>
:root{
  --bg:#070b10; --bg2:#0b1219; --panel:#0f1822; --panel2:#131f2b;
  --line:#1e2d3c; --line2:#26394b;
  --ink:#e8f2f6; --ink2:#a9c0cd; --mute:#6d8698;
  --teal:#2fe0c8; --teal2:#12b6a3; --violet:#a06bff; --pink:#ff4d8d;
  --radius:16px; --maxw:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:Vazirmatn,Inter,system-ui,sans-serif;
  line-height:1.9; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body[dir="ltr"]{font-family:Inter,Vazirmatn,system-ui,sans-serif}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 520px at 82% -8%, rgba(47,224,200,.13), transparent 62%),
    radial-gradient(820px 480px at 12% 4%, rgba(160,107,255,.12), transparent 60%),
    radial-gradient(700px 420px at 50% 100%, rgba(255,77,141,.06), transparent 60%);
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;position:relative;z-index:1}
a{color:var(--teal);text-decoration:none}
a:hover{color:#7ff3e2}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);
  background:rgba(7,11,16,.82);border-bottom:1px solid var(--line);
}
.top .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);
     box-shadow:0 0 14px var(--teal);flex:none}
.top nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.top nav a{
  color:var(--ink2);font-size:13px;font-weight:500;padding:7px 12px;border-radius:9px;
  white-space:nowrap;transition:.16s
}
.top nav a:hover{background:var(--panel2);color:var(--ink)}
.langtog{
  display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none
}
.langtog button{
  background:transparent;border:0;color:var(--ink2);font:inherit;font-size:12.5px;
  font-weight:700;padding:7px 13px;cursor:pointer;transition:.16s
}
.langtog button.on{background:var(--teal);color:#04211d}
@media(max-width:860px){ .top nav{display:none} }

/* ---------- hero ---------- */
.hero{padding:64px 0 34px;position:relative}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;
  color:var(--teal);background:rgba(47,224,200,.09);border:1px solid rgba(47,224,200,.24);
  padding:6px 14px;border-radius:999px;margin-bottom:20px
}
.hero h1{
  font-size:clamp(30px,5.4vw,54px);font-weight:900;line-height:1.28;letter-spacing:-.5px;
  background:linear-gradient(120deg,#ffffff 8%,#9fe9dc 52%,#b79bff 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  padding-bottom:.1em
}
.hero .role{color:var(--teal);font-weight:600;font-size:clamp(14px,2.1vw,17px);margin-top:8px}
.hero .tag{color:var(--ink2);font-size:clamp(14px,2vw,17px);max-width:60ch;margin-top:14px}
.meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.meta span,.meta a{
  font-size:12.5px;color:var(--ink2);background:var(--panel);
  border:1px solid var(--line);border-radius:9px;padding:6px 13px
}
.meta a{color:var(--teal);border-color:rgba(47,224,200,.28)}
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px
}
.stats div{
  background:linear-gradient(160deg,var(--panel),rgba(15,24,34,.35));
  border:1px solid var(--line);border-radius:14px;padding:16px 14px;text-align:center
}
.stats b{
  display:block;font-size:clamp(20px,3.4vw,30px);font-weight:900;color:var(--teal);
  line-height:1.35;letter-spacing:-.5px
}
.stats span{display:block;font-size:11.5px;color:var(--mute);line-height:1.6;margin-top:3px}
@media(max-width:700px){ .stats{grid-template-columns:repeat(2,1fr)} }

/* ---------- section ---------- */
section.blk{padding:56px 0 8px;scroll-margin-top:76px}
.shead{border-top:1px solid var(--line);padding-top:30px;margin-bottom:22px}
.skick{
  font-size:12px;font-weight:600;color:var(--violet);letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:8px
}
.shead h2{
  font-size:clamp(22px,3.6vw,34px);font-weight:900;letter-spacing:-.4px;line-height:1.35
}
.sintro{color:var(--ink2);font-size:15px;max-width:78ch;margin-top:12px}

/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:26px}
@media(max-width:900px){ .grid{grid-template-columns:1fr} }
.card{
  background:linear-gradient(170deg,var(--panel),rgba(11,18,25,.6));
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .2s,transform .2s
}
.card:hover{border-color:var(--line2)}
.stage{
  position:relative;background:#05090d;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;overflow:hidden
}
.stage .inner{width:100%;position:relative}
.stage img.poster{width:100%;height:100%;object-fit:cover;display:block}
.stage iframe,.stage video{width:100%;height:100%;display:block;border:0;background:#000}
.playbtn{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(5,9,13,.12),rgba(5,9,13,.62));
  border:0;cursor:pointer;transition:.2s
}
.playbtn:hover{background:linear-gradient(180deg,rgba(5,9,13,.02),rgba(5,9,13,.5))}
.playbtn i{
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:rgba(47,224,200,.94);box-shadow:0 10px 34px rgba(47,224,200,.34);
  transition:transform .2s
}
.playbtn:hover i{transform:scale(1.08)}
.playbtn svg{width:24px;height:24px;fill:#04211d;margin-inline-start:3px}
.badge{
  position:absolute;bottom:10px;inset-inline-end:10px;background:rgba(4,8,12,.86);
  color:#dff6f1;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;
  border:1px solid rgba(255,255,255,.1);letter-spacing:.3px;font-family:Inter,sans-serif
}
.nosrc{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:20px;background:linear-gradient(180deg,rgba(5,9,13,.55),rgba(5,9,13,.82))
}
.nosrc b{
  font-size:12.5px;font-weight:600;color:#cfe0e4;background:rgba(10,18,26,.92);
  border:1px solid var(--line2);border-radius:999px;padding:7px 16px;
  display:inline-flex;align-items:center;gap:8px;backdrop-filter:blur(4px)
}
.nosrc i{
  width:7px;height:7px;border-radius:50%;background:var(--violet);flex:none;
  box-shadow:0 0 10px var(--violet)
}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:11px;flex:1}
.body h3{font-size:17.5px;font-weight:800;line-height:1.5;letter-spacing:-.2px}
.body p{color:var(--ink2);font-size:14px;line-height:1.95}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;padding-top:4px}
.tags span{
  font-size:11.5px;color:#9fd9cf;background:rgba(47,224,200,.08);
  border:1px solid rgba(47,224,200,.2);border-radius:7px;padding:3px 10px
}

/* ---------- footer ---------- */
footer{
  margin-top:70px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(15,24,34,.5),transparent)
}
footer .wrap{padding:40px 22px 56px}
footer h3{font-size:20px;font-weight:800;margin-bottom:10px}
footer p{color:var(--ink2);font-size:14.5px;max-width:66ch}
.cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:20px}
.cta a{
  background:var(--teal);color:#04211d;font-weight:800;font-size:14px;
  padding:11px 20px;border-radius:11px;transition:.16s
}
.cta a:hover{background:#7ff3e2;color:#04211d}
.cta a.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.cta a.ghost:hover{background:var(--panel2);color:var(--ink)}
.fine{margin-top:26px;color:var(--mute);font-size:12px}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
</style>
</head>

<script>
const D = {"profile":{"name_fa":"سید محمد ایمان منصوری","name_en":"Seyed Mohammad Iman Mansouri","role_fa":"سازنده بازی و نرم‌افزار · طراح سیستم‌های خودکار هوش مصنوعی · مدرس Unity","role_en":"Game & Software Developer · AI Automation Systems Engineer · Unity Instructor","tag_fa":"بازی و اپلیکیشن می‌سازم، ابزارِ ساختشان را هم خودم می‌نویسم، و همین را تدریس می‌کنم.","tag_en":"I build games and applications, I write the tools that build them, and I teach it.","location_fa":"مشهد، ایران","location_en":"Mashhad, Iran","email":"iman392392@gmail.com","phone":"0933 165 5416","live_fa":"نسخه زنده NitroLango","live_en":"NitroLango live build","live_url":"https://nitrolango-client.vercel.app"},"stats":[{"n_fa":"۱۹","n_en":"19","l_fa":"ویدیوی مستند","l_en":"documented videos"},{"n_fa":"۵۶","n_en":"56","l_fa":"دقیقه تصویر","l_en":"minutes of footage"},{"n_fa":"۶","n_en":"6","l_fa":"بازی و اپلیکیشن","l_en":"games & apps"},{"n_fa":"۳۱۵K","n_en":"315K","l_fa":"دنبال‌کننده استریمری که بازی را تجربه کرد","l_en":"follower streamer who played the game"}],"sections":[{"id":"neonrun","title_fa":"Neon Run: Echo’s Escape","title_en":"Neon Run: Echo’s Escape","kicker_fa":"بازی سه‌بعدی چندپلتفرمه · پروژه اصلی","kicker_en":"Cross-platform 3D game · flagship project","intro_fa":"بازی دونده در جهانی سایبرپانک: سال ۲۱۸۹، شهری که شرکت‌های بزرگ اداره‌اش می‌کنند و دختری به نام Echo که باید از سامانه امنیتی فرار کند. شش حالت بازی — تک‌نفره، دونفره و گروهی، هرکدام در دو نمای اول‌شخص و سوم‌شخص — و اجرای یکسان روی موبایل، کامپیوتر و هدست واقعیت مجازی. ساخت فنی بازی (کد، دوربین، رابط کاربری و حالت‌های چندنفره) کار من بوده است.","intro_en":"A runner set in a cyberpunk world: the year 2189, a corporate-run city, and a girl named Echo who has to escape the security grid. Six game modes — solo, duo and squad, each in first-person and third-person — running identically on mobile, PC and VR headset. The technical build of the game (code, camera, UI and the multiplayer modes) is my work.","nav_fa":"Neon Run","nav_en":"Neon Run","videos":[{"title_fa":"حالت تک‌نفره اول‌شخص","title_en":"Solo First-Person Mode","dur":"4:30","desc_fa":"یک اجرای کامل از منوی اصلی تا پایان بازی، در نمای اول‌شخص. در این ویدیو منوی اصلی (شروع بازی، انتخاب حالت، فروشگاه ارتقا)، تولید بی‌نهایتِ مسیر و مانع، قابلیت ویژه «سپر»، نوار انرژی، شمارش امتیاز و مسافت طی‌شده، و در انتها صفحه انتخاب حالت دیده می‌شود. امتیاز پایانی نزدیک ۲٬۰۰۰ و مسافت بیش از ۶ کیلومتر است.","desc_en":"A full run from the main menu to the end of the round, in first-person view. This clip shows the main menu (play, mode select, upgrade shop), the endless procedural generation of track and obstacles, the Shield ability, the energy bar, live score and distance counters, and the mode-select screen at the end. Final score is close to 2,000 over more than 6 km of distance.","tags_fa":["Unity","نمای اول‌شخص","تولید بی‌نهایت مسیر","قابلیت ویژه"],"tags_en":["Unity","First-person","Procedural track","Abilities"],"id":"v11","ar":"16/9","yt":"","file":"media/v11.mp4","poster":"media/v11.jpg","poster2":""},{"title_fa":"حالت تک‌نفره سوم‌شخص (ضبط‌شده در یونیتی)","title_en":"Solo Third-Person Mode (recorded in Unity)","dur":"3:39","desc_fa":"همان بازی از نمای سوم‌شخص، مستقیماً داخل موتور Unity ضبط شده است. دوربین پشت‌سرِ شخصیت، برخورد با موانع، فعال شدن سپر، و صفحه پایان بازی «ECHO LOST» با امتیاز نهایی ۴۲٬۱۸۰ و مسافت ۳٫۴ کیلومتر. اینکه ضبط داخل خود موتور انجام شده یعنی آنچه می‌بینید نسخه در دست ساخت است، نه ویدیوی تبلیغاتی.","desc_en":"The same game from the third-person camera, recorded directly inside the Unity editor. You see the over-the-shoulder camera, obstacle collisions, the Shield ability triggering, and the ECHO LOST end screen with a final score of 42,180 over 3.4 km. Recording inside the engine means what you are watching is the working build, not a marketing cut.","tags_fa":["Unity Editor","نمای سوم‌شخص","سیستم امتیاز","صفحه پایان بازی"],"tags_en":["Unity Editor","Third-person","Scoring system","End screen"],"id":"v12","ar":"16/9","yt":"","file":"media/v12.mp4","poster":"media/v12.jpg","poster2":""},{"title_fa":"حالت دونفره با صفحه تقسیم‌شده","title_en":"Two-Player Split-Screen Mode","dur":"4:20","desc_fa":"حالت رقابتی دونفره روی یک دستگاه، با صفحه تقسیم‌شده. هر بازیکن دوربین، امتیاز، نوار انرژی و شمارنده مسافت مستقل خودش را دارد و هر دو نمای اول‌شخص و سوم‌شخص در طول ویدیو دیده می‌شود. سخت‌ترین بخش فنی این بازی همین است: دو دوربین، دو مجموعه ورودی و دو رابط کاربری مستقل که باید هم‌زمان و روان اجرا شوند.","desc_en":"Competitive two-player mode on a single machine with a split screen. Each player has an independent camera, score, energy bar and distance counter, and both first-person and third-person views appear during the clip. This is the hardest technical piece in the game: two cameras, two input sets and two independent HUDs that have to run simultaneously and stay smooth.","tags_fa":["صفحه تقسیم‌شده","چندنفره محلی","دو دوربین","رابط کاربری مستقل"],"tags_en":["Split-screen","Local multiplayer","Dual camera","Independent HUD"],"id":"v13","ar":"16/9","yt":"","file":"media/v13.mp4","poster":"media/v13.jpg","poster2":""},{"title_fa":"نشست کامل بازی — حالت‌ها، قابلیت‌ها، برد و باخت","title_en":"Full Session — Modes, Abilities, Victory & Defeat","dur":"7:00","desc_fa":"بلندترین ویدیوی این مجموعه و کامل‌ترین نمای بازی. از صفحه «SELECT MODE» با هر شش حالت (SOLO / DUO / SQUAD، هرکدام در دو نمای TPS و FPS) شروع می‌شود، سپس چند اجرای پشت‌سرهم را نشان می‌دهد: فعال شدن «DASH» و «SHIELD»، عبور از موانع رنگی، و در پایان هر دو صفحه «DEFEAT» و «VICTORY». اگر فقط یک ویدیو را می‌خواهید ببینید، همین است.","desc_en":"The longest clip in this collection and the most complete view of the game. It opens on the SELECT MODE screen with all six modes (SOLO / DUO / SQUAD, each in TPS and FPS), then runs through several back-to-back rounds: DASH and SHIELD activating, weaving through coloured obstacles, and finally both the DEFEAT and VICTORY screens. If you only watch one video, watch this one.","tags_fa":["شش حالت بازی","قابلیت‌های ویژه","برد و باخت","اجرای کامل"],"tags_en":["Six modes","Abilities","Win & loss states","Full playthrough"],"id":"v01","ar":"16/9","yt":"ZzzN5w3fVd8","file":"","poster":"media/v01.jpg","poster2":"https://i.ytimg.com/vi/ZzzN5w3fVd8/hqdefault.jpg"},{"title_fa":"اجرای قابلیت‌های ویژه — سپر و شتاب","title_en":"Ability Run — Shield & Dash","dur":"3:34","desc_fa":"اجرایی با تمرکز روی قابلیت‌های ویژه بازیکن. «SHIELD ACTIVE» بارها در طول مسیر فعال می‌شود، سرعت و چگالی موانع بالا می‌رود و امتیاز تا ۳٬۴۹۰ می‌رسد. تغییرات نورپردازی و پالت رنگ بین بخش‌های مختلف شهر هم در همین ویدیو دیده می‌شود.","desc_en":"A run focused on the player abilities. SHIELD ACTIVE triggers repeatedly along the track, speed and obstacle density ramp up, and the score climbs to 3,490. The lighting and colour-palette shifts between different districts of the city are also visible in this clip.","tags_fa":["سپر","شتاب","افزایش سختی","نورپردازی"],"tags_en":["Shield","Dash","Difficulty ramp","Lighting"],"id":"v02","ar":"16/9","yt":"0N9wJrbxxFI","file":"","poster":"media/v02.jpg","poster2":"https://i.ytimg.com/vi/0N9wJrbxxFI/hqdefault.jpg"},{"title_fa":"اجرای بی‌پایان تا صفحه ECHO LOST","title_en":"Endless Run to the ECHO LOST Screen","dur":"3:27","desc_fa":"یک اجرای پیوسته از انتخاب حالت تا باخت. تمرکز این ویدیو روی چرخه کامل بازی است: انتخاب حالت، اجرا، افزایش تدریجی سرعت، برخورد نهایی، و صفحه پایان با گزینه‌های «RUN AGAIN»، «UPGRADES» و «MAIN MENU» — یعنی حلقه بازگشت بازیکن به بازی.","desc_en":"One continuous run from mode select to failure. The focus here is the complete game loop: pick a mode, run, watch the speed ramp up, take the final hit, and land on the end screen with RUN AGAIN, UPGRADES and MAIN MENU — the loop that brings the player back in.","tags_fa":["حلقه بازی","صفحه پایان","فروشگاه ارتقا"],"tags_en":["Game loop","End screen","Upgrade shop"],"id":"v03","ar":"16/9","yt":"lNXMJg3NH5Y","file":"","poster":"media/v03.jpg","poster2":"https://i.ytimg.com/vi/lNXMJg3NH5Y/hqdefault.jpg"}]},{"id":"event","title_fa":"رویداد Negative Five — بازخورد واقعی بازار","title_en":"Negative Five Event — Real Market Feedback","kicker_fa":"غرفه اختصاصی · دوره سوم · ۲۰۲۶","kicker_en":"Dedicated booth · third cohort · 2026","intro_fa":"نسخه قابل بازی Neon Run در رویداد شتاب‌دهنده Negative Five روی غرفه اختصاصی ارائه شد. ده‌ها بازدیدکننده بازی کردند، دو تولیدکننده محتوای گیم آن را معرفی کردند، و مدیر یکی از قدیمی‌ترین مجموعه‌های بازی‌سازی ایران پشت دستگاه نشست. این بخش، تصویرِ خامِ همان روز است.","intro_en":"The playable build of Neon Run was presented on a dedicated booth at the Negative Five accelerator event. Dozens of visitors played it, two gaming content creators covered it, and the head of one of Iran's oldest game studios sat down behind the controller. This section is the raw footage from that day.","nav_fa":"رویداد و بازخورد","nav_en":"Event & Feedback","videos":[{"title_fa":"مریم خواجوی (۳۱۵ هزار دنبال‌کننده) در حال بازی روی غرفه","title_en":"Maryam Khajavi (315K followers) Playing at the Booth","dur":"1:30","desc_fa":"مریم خواجوی (iholymary)، تولیدکننده محتوای بازی با بیش از ۳۱۵ هزار دنبال‌کننده در اینستاگرام، پشت لپ‌تاپ غرفه نشسته و با دسته بازی می‌کند — چند دقیقه پشت‌سر هم و بدون توقف. او پس از بازی یادداشتی دست‌نویس و امضاشده درباره بازی نوشت: «تجربه‌اش برام خیلی لذت‌بخش بود… خیلی اعتیادآور بود!»","desc_en":"Maryam Khajavi (iholymary), a gaming content creator with over 315,000 Instagram followers, sitting at the booth laptop and playing with a controller — several minutes back to back without stopping. After playing she wrote and signed a handwritten note about the game: \"I really enjoyed the experience… it was very addictive!\"","tags_fa":["بازخورد استریمر","۳۱۵K دنبال‌کننده","یادداشت امضاشده"],"tags_en":["Streamer feedback","315K followers","Signed note"],"id":"v19","ar":"1/1","yt":"","file":"media/v19.mp4","poster":"media/v19.jpg","poster2":""},{"title_fa":"مدیر مجموعه «بازی‌ساز باش» پشت بازی","title_en":"Head of bazisazbash Playing the Game","dur":"0:10","desc_fa":"مدیر یکی از قدیمی‌ترین و بزرگ‌ترین مجموعه‌های بازی‌سازی ایران (bazisazbash) پشت دستگاه نشسته، بازی را تجربه می‌کند و درباره‌اش صحبت می‌کند. کوتاه، اما یکی از مهم‌ترین لحظه‌های آن روز.","desc_en":"The head of one of Iran's oldest and largest game-development groups (bazisazbash) sitting at the machine, playing the build and talking about it. Short, but one of the most important moments of that day.","tags_fa":["بازخورد صنعت","bazisazbash"],"tags_en":["Industry feedback","bazisazbash"],"id":"v06","ar":"1/1","yt":"VW4HtvmWwmc","file":"","poster":"media/v06.jpg","poster2":"https://i.ytimg.com/vi/VW4HtvmWwmc/hqdefault.jpg"},{"title_fa":"بازدید مدیر «بازی‌ساز باش» از غرفه","title_en":"bazisazbash Visit to the Booth","dur":"0:06","desc_fa":"لحظه بازدید از غرفه Neon Run: بنر بازی، لپ‌تاپ‌های آماده و گفت‌وگو کنار میز. مکمل ویدیوی قبلی است و فضای غرفه را در همان لحظه نشان می‌دهد.","desc_en":"The moment of the visit to the Neon Run booth: the game banner, the set-up laptops and the conversation beside the table. A companion to the previous clip, showing the booth environment at that same moment.","tags_fa":["غرفه","بازدید"],"tags_en":["Booth","Studio visit"],"id":"v18","ar":"16/9","yt":"","file":"media/v18.mp4","poster":"media/v18.jpg","poster2":""},{"title_fa":"غرفه Neon Run و بازدیدکنندگان در حال بازی","title_en":"The Neon Run Booth & Visitors Playing","dur":"0:25","desc_fa":"نمای نزدیک از غرفه: بنر اختصاصی «NEON RUN — ECHO’S ESCAPE»، تابلوی تیم GAME TOPIA، و بازدیدکنندگانی که پشت لپ‌تاپ‌ها نشسته‌اند و بازی می‌کنند. صفحه‌های بازی در همین ویدیو دیده می‌شود.","desc_en":"A close view of the booth: the dedicated NEON RUN — ECHO'S ESCAPE banner, the GAME TOPIA team card, and visitors seated at the laptops playing. The game screens themselves are visible in this clip.","tags_fa":["غرفه اختصاصی","GAME TOPIA","بازدیدکنندگان"],"tags_en":["Dedicated booth","GAME TOPIA","Visitors"],"id":"v04","ar":"1/1","yt":"Tq0kUaESOTM","file":"","poster":"media/v04.jpg","poster2":"https://i.ytimg.com/vi/Tq0kUaESOTM/hqdefault.jpg"},{"title_fa":"نمای کامل غرفه در رویداد","title_en":"Wide Shot of the Booth","dur":"0:25","desc_fa":"نمای بازتر از همان غرفه، این بار افقی: جایگاه بازی در کنار سایر غرفه‌ها، تیم رسانه‌ای رویداد، و بازدیدکنندگانی که در صف بازی ایستاده‌اند.","desc_en":"A wider, landscape shot of the same booth: where the game sat relative to the other stands, the event media team, and visitors queuing to play.","tags_fa":["نمای کلی","فضای رویداد"],"tags_en":["Wide shot","Event floor"],"id":"v05","ar":"16/9","yt":"7RKj_aEj5Ss","file":"","poster":"media/v05.jpg","poster2":"https://i.ytimg.com/vi/7RKj_aEj5Ss/hqdefault.jpg"},{"title_fa":"مراسم اهدای گواهی روی صحنه","title_en":"Certificate Ceremony on Stage","dur":"0:39","desc_fa":"مراسم اهدای گواهی‌نامه‌های رویداد در سالن اصلی. گواهی رسمی Negative Five / Xelerate VR با امضای مدیرعامل شتاب‌دهنده و نماینده Xelerate VR، به نام سید ایمان منصوری صادر شده است.","desc_en":"The event's certificate ceremony in the main auditorium. The official Negative Five / Xelerate VR certificate, signed by the accelerator's CEO and the Xelerate VR representative, was issued in the name of Seyed Iman Mansouri.","tags_fa":["گواهی رسمی","Negative Five","Xelerate VR"],"tags_en":["Official certificate","Negative Five","Xelerate VR"],"id":"v17","ar":"16/9","yt":"","file":"media/v17.mp4","poster":"media/v17.jpg","poster2":""},{"title_fa":"گردش کامل در فضای رویداد","title_en":"Full Venue Walkthrough","dur":"3:24","desc_fa":"طولانی‌ترین ویدیوی این بخش: یک گردش پیوسته از ورودی ساختمان تا داخل سالن‌ها. غرفه‌ها، ایستگاه‌های بازی، تیم‌های حاضر و مقیاس واقعی رویداد در این ویدیو دیده می‌شود.","desc_en":"The longest clip in this section: one continuous walk from the building entrance through to the interior halls. Booths, play stations, the teams present and the real scale of the event are all visible here.","tags_fa":["گردش رویداد","غرفه‌ها","مقیاس رویداد"],"tags_en":["Venue tour","Booths","Event scale"],"id":"v07","ar":"9/16","yt":"7wYOaFiNnK0","file":"","poster":"media/v07.jpg","poster2":"https://i.ytimg.com/vi/7wYOaFiNnK0/hqdefault.jpg"},{"title_fa":"بازدیدکنندگان و غرفه‌داران","title_en":"Crowd & Exhibitors","dur":"0:24","desc_fa":"جمعیت داخل سالن، تیم‌های حاضر با کارت‌های شناسایی، و پوشش رسانه‌ای رویداد با دوربین‌های حرفه‌ای.","desc_en":"The crowd inside the hall, exhibiting teams wearing their badges, and the event's media coverage with professional cameras.","tags_fa":["جمعیت","پوشش رسانه‌ای"],"tags_en":["Crowd","Media coverage"],"id":"v08","ar":"9/16","yt":"jGLfLyJ3WrQ","file":"","poster":"media/v08.jpg","poster2":"https://i.ytimg.com/vi/jGLfLyJ3WrQ/hqdefault.jpg"},{"title_fa":"سالن‌ها، کاسپلی و غرفه‌های دیگر","title_en":"Halls, Cosplay & Other Stands","dur":"0:28","desc_fa":"بخش دیگری از رویداد: سالن‌های نمایش، غرفه‌های استودیوهای دیگر، و کاسپلی‌های حاضر. برای درک فضای کلی رویدادی که بازی در آن ارائه شد.","desc_en":"Another part of the event: the exhibition halls, other studios' stands, and the cosplayers present — useful context for the environment the game was presented in.","tags_fa":["سالن نمایش","کاسپلی","استودیوهای دیگر"],"tags_en":["Exhibition hall","Cosplay","Other studios"],"id":"v09","ar":"9/16","yt":"06yBiP-7w_o","file":"","poster":"media/v09.jpg","poster2":"https://i.ytimg.com/vi/06yBiP-7w_o/hqdefault.jpg"}]},{"id":"commercial","title_fa":"بازی‌های تجاری و پروژه‌های شرکتی","title_en":"Commercial & Studio Projects","kicker_fa":"کار حرفه‌ای در دو شرکت بازی‌سازی مشهد","kicker_en":"Professional work at two Mashhad game studios","intro_fa":"از سال ۱۴۰۲ در دو شرکت بازی‌سازی کار کرده‌ام و در انتشار دو بازی موبایل در کافه‌بازار و مایکت نقش داشته‌ام. آنچه اینجا می‌بینید، بخش‌هایی است که کدش را خودم نوشته‌ام.","intro_en":"Since 2023 I have worked at two game studios and contributed to shipping two mobile titles on Cafe Bazaar and Myket. What you see here are the parts I personally wrote the code for.","nav_fa":"بازی‌های تجاری","nav_en":"Commercial Games","videos":[{"title_fa":"آرش کمانگیر — بازی تجاری موبایل","title_en":"Arash Kamangir (Archer) — Commercial Mobile Game","dur":"3:25","desc_fa":"بازی تجاری موبایل، ساخته‌شده در واحد فناور گیم‌توپیا (پارک علم و فناوری دانشگاه فردوسی مشهد). نقش من: برنامه‌نویس گیم‌پلی و سازنده ابزار. در این ویدیو منوی بازی (حالت داستانی، حالت بی‌پایان و فروشگاه)، سیستم تیراندازی با کمان با محاسبه مسیر پرتاب و برخورد، نبرد موج‌به‌موج با دشمنان، و پایان مرحله و امتیازدهی دیده می‌شود. علاوه بر گیم‌پلی، ابزاری اختصاصی نوشتم تا تیم طراحی بتواند مراحل را بدون کدنویسی بچیند.","desc_en":"A commercial mobile title built at the Game Topia technology unit (Ferdowsi University of Mashhad Science & Technology Park). My role: gameplay programmer and tools developer. The clip shows the game menu (campaign, endless mode and shop), the archery system with trajectory and collision calculation, wave-based combat, and the end-of-level scoring. Beyond gameplay I wrote a dedicated editor tool so the design team could build levels without touching code.","tags_fa":["گیم‌توپیا","سیستم تیراندازی","ابزار سازنده مرحله","بهینه‌سازی موبایل"],"tags_en":["Game Topia","Archery system","Level editor tool","Mobile optimisation"],"id":"v14","ar":"16/9","yt":"","file":"media/v14.mp4","poster":"media/v14.jpg","poster2":""},{"title_fa":"Bus Escape — پازل ترافیک، مراحل ۱ تا ۳","title_en":"Bus Escape — Traffic Puzzle, Levels 1 to 3","dur":"2:00","desc_fa":"پازل ترافیک برای موبایل؛ پروژه شخصی. نقش من: طراح الگوریتم و سازنده منطق بازی. هر خودرو باید بدون گیر افتادن از میان شبکه شطرنجی به صف رنگ خودش برسد. در این ویدیو سه مرحله با درجه سختی افزایشی، وضعیت انتظار برای رسیدن خودرو، و ابزارهای کمکی (Refresh / Clear / Sort) نشان داده می‌شود.","desc_en":"A mobile traffic puzzle; a personal project. My role: algorithm design and game logic. Each vehicle has to reach the queue of its own colour through a grid without deadlocking. The clip shows three levels of increasing difficulty, the waiting state for an incoming vehicle, and the assist tools (Refresh / Clear / Sort).","tags_fa":["الگوریتم مسیریابی","طراحی مرحله","اجرای روان روی موبایل"],"tags_en":["Pathfinding algorithm","Level design","Mobile performance"],"id":"v15","ar":"9/16","yt":"","file":"media/v15.mp4","poster":"media/v15.jpg","poster2":""}]},{"id":"nitrolango","title_fa":"NitroLango — پلتفرم آموزش زبان","title_en":"NitroLango — Language Learning Platform","kicker_fa":"وب‌اپلیکیشن هوشمند · نسخه زنده","kicker_en":"AI-powered web application · live build","intro_fa":"پلتفرم کامل یادگیری زبان که از پایه ساخته‌ام: ثبت‌نام کاربر، ذخیره‌سازی ابری، و تمرین‌هایی که به‌جای فهرست خشک لغت به‌شکل بازی طراحی شده‌اند — مسابقه سرعت، تمرین شنیداری، جمله‌سازی و بازی تایپ. یک دستیار هوش مصنوعی درون محصول، مسیر یادگیری را متناسب با سطح کاربر می‌سازد.","intro_en":"A complete language-learning platform built from scratch: user accounts, cloud storage, and drills designed as games rather than dry vocabulary lists — speed arenas, listening practice, sentence building and a typing game. An in-product AI assistant generates a learning path matched to the user's level.","nav_fa":"NitroLango","nav_en":"NitroLango","videos":[{"title_fa":"تور کامل پلتفرم NitroLango","title_en":"Full NitroLango Platform Tour","dur":"8:03","desc_fa":"کامل‌ترین ویدیوی این محصول: از ثبت‌نام و ورود کاربر تا هر بخش پلتفرم. «Custom AI Learning Path Generator» که مسیر یادگیری اختصاصی می‌سازد، شبکه واژگان کاربر، تمرین‌های بازی‌گونه با امتیاز و زمان، تمرین شنیداری، و داشبورد پیشرفت با نمودار. تمام این پلتفرم — از رابط کاربری تا پایگاه داده ابری و دستیار هوشمند داخل محصول — از پایه ساخته شده است.","desc_en":"The most complete video of this product: from sign-up and login through every part of the platform. The Custom AI Learning Path Generator that builds a personalised study route, the user's vocabulary grid, gamified drills with score and timer, listening practice, and the progress dashboard with charts. The whole platform — UI, cloud database and the in-product AI assistant — was built from scratch.","tags_fa":["ثبت‌نام و ورود","پایگاه داده ابری","دستیار هوش مصنوعی","داشبورد پیشرفت"],"tags_en":["Auth","Cloud database","AI assistant","Progress dashboard"],"id":"v16","ar":"16/9","yt":"","file":"media/v16.mp4","poster":"media/v16.jpg","poster2":""},{"title_fa":"آخرین به‌روزرسانی NitroLango","title_en":"NitroLango — Latest Update","dur":"7:48","desc_fa":"نسخه به‌روزشده پلتفرم با بخش‌های تازه: «Neural Game Arena Master» به‌عنوان مرکز تمرین‌های بازی‌گونه، «Syntax Overclock» برای تمرین ساختار جمله، «Speed Match Arena» برای مسابقه سرعت، و «Acceleration Portal» با تمرین‌های آلمانی–فارسی. داشبورد حافظه و پیشرفت کاربر هم در همین ویدیو دیده می‌شود.","desc_en":"The updated build with new sections: Neural Game Arena Master as the hub for the gamified drills, Syntax Overclock for sentence structure, Speed Match Arena for timed matching, and the Acceleration Portal with German–Persian exercises. The memory and progress dashboard is also shown in this clip.","tags_fa":["تمرین بازی‌گونه","آلمانی–فارسی","داشبورد حافظه"],"tags_en":["Gamified drills","German–Persian","Memory dashboard"],"id":"v10","ar":"16/9","yt":"","file":"media/v10.mp4","poster":"media/v10.jpg","poster2":""}]}]};

      fText:'هر مورد این صفحه ویدیوی ضبط‌شده دارد و هر ادعا با فعل، عدد یا مدرک همراه است. برای نسخه قابل نصب بازی، سورس، یا جلسه‌ی دمو کافی است پیام بدهید.',
      ctaMail:'ارسال ایمیل', ctaLive:'تجربه زنده NitroLango',
      fine:'این صفحه فقط با لینک قابل دسترسی است و در موتورهای جستجو فهرست نمی‌شود.'},
  en:{eyebrow:'Product video archive',
      nav:'Sections',
      noSrc:'Upload in progress — coming shortly',
      play:'Play',
      fTitle:'For a playable build or a live product demo, get in touch',
      fText:'Every item on this page has recorded footage behind it, and every claim comes with a verb, a number or a document. For an installable build, the source, or a live demo session, just send a message.',
      ctaMail:'Send an email', ctaLive:'Try NitroLango live',
      fine:'This page is link-only and is not indexed by search engines.'}
};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function L(o,k){return o[k+'_'+LANG];}

function render(){
  const t=T[LANG], p=D.profile;
  document.body.dir = LANG==='fa'?'rtl':'ltr';
  document.body.lang = LANG;
  document.title = (LANG==='fa'?p.name_fa:p.name_en)+' — '+t.eyebrow;
  document.getElementById('btnFa').className = LANG==='fa'?'on':'';
  document.getElementById('btnEn').className = LANG==='en'?'on':'';
  document.getElementById('brandName').textContent = LANG==='fa'?p.name_fa:p.name_en;
  document.getElementById('eyebrow').textContent = t.eyebrow;
  document.getElementById('pName').textContent = LANG==='fa'?p.name_fa:p.name_en;
  document.getElementById('pRole').textContent = LANG==='fa'?p.role_fa:p.role_en;
  document.getElementById('pTag').textContent  = LANG==='fa'?p.tag_fa:p.tag_en;

  document.getElementById('pMeta').innerHTML =
    '<span>'+esc(LANG==='fa'?p.location_fa:p.location_en)+'</span>'+
    '<a href="mailto:'+esc(p.email)+'" class="en">'+esc(p.email)+'</a>'+
    '<span class="en">'+esc(p.phone)+'</span>'+
    '<a href="'+esc(p.live_url)+'" target="_blank" rel="noopener">'+
      esc(LANG==='fa'?p.live_fa:p.live_en)+'</a>';

  document.getElementById('pStats').innerHTML = D.stats.map(s=>
    '<div><b>'+esc(LANG==='fa'?s.n_fa:s.n_en)+'</b><span>'+
    esc(LANG==='fa'?s.l_fa:s.l_en)+'</span></div>').join('');

  document.getElementById('nav').innerHTML = D.sections.map(s=>
    '<a href="#'+s.id+'">'+esc(L(s,'nav'))+'</a>').join('');

  document.getElementById('main').innerHTML = D.sections.map(s=>
    '<section class="blk" id="'+s.id+'"><div class="wrap">'+
      '<div class="shead">'+
        '<div class="skick">'+esc(L(s,'kicker'))+'</div>'+
        '<h2>'+esc(L(s,'title'))+'</h2>'+
        '<p class="sintro">'+esc(L(s,'intro'))+'</p>'+
      '</div>'+
      '<div class="grid">'+s.videos.map(card).join('')+'</div>'+
    '</div></section>').join('');

  document.getElementById('fTitle').textContent = t.fTitle;
  document.getElementById('fText').textContent  = t.fText;
  document.getElementById('fCta').innerHTML =
    '<a href="mailto:'+esc(p.email)+'">'+esc(t.ctaMail)+'</a>'+
    '<a class="ghost" href="'+esc(p.live_url)+'" target="_blank" rel="noopener">'+
      esc(t.ctaLive)+'</a>';
  document.getElementById('fFine').textContent = t.fine;
}

function card(v){
  const t=T[LANG];
  const has = !!(v.yt || v.file);
  const stage =
    '<div class="stage" data-id="'+v.id+'" data-yt="'+esc(v.yt)+'" data-file="'+esc(v.file)+'">'+
      '<div class="inner" style="aspect-ratio:'+v.ar+'">'+
        (v.poster
          ? '<img class="poster" src="'+esc(v.poster)+'" alt="" loading="lazy" '+
            'data-alt="'+esc(v.poster2||'')+'" onerror="posterFallback(this)">'
          : '')+
        (has
          ? '<button class="playbtn" aria-label="'+esc(t.play)+'" onclick="playIt(this)">'+
              '<i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i></button>'
          : '<div class="nosrc"><b><i></i>'+esc(t.noSrc)+'</b></div>')+
        '<span class="badge">'+esc(v.dur)+'</span>'+
      '</div>'+
    '</div>';
  return '<article class="card">'+stage+
    '<div class="body">'+
      '<h3>'+esc(L(v,'title'))+'</h3>'+
      '<p>'+esc(L(v,'desc'))+'</p>'+
      '<div class="tags">'+(v['tags_'+LANG]||[]).map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>'+
    '</div></article>';
}

function posterFallback(img){
  const alt = img.dataset.alt;
  if (alt && img.src !== alt) { img.dataset.alt=''; img.src = alt; }
  else { img.remove(); }
}

function playIt(btn){
  const stage = btn.closest('.stage'), inner = btn.closest('.inner');
  const yt = stage.dataset.yt, file = stage.dataset.file;
  inner.innerHTML = yt
    ? '<iframe src="https://www.youtube-nocookie.com/embed/'+yt+
      '?autoplay=1&rel=0&modestbranding=1" allow="accelerometer;autoplay;encrypted-media;'+
      'gyroscope;picture-in-picture;fullscreen" allowfullscreen></iframe>'
    : '<video src="'+file+'" controls autoplay playsinline preload="metadata"></video>';
}

function setLang(l){ LANG=l; render(); }
render();
</script>
</body>
</html>
